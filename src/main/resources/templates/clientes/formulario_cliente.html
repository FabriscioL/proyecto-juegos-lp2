<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Usuario/Cliente - JUEGOS.NET</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
		body {
		    background-color: #1a0508;
		    color: #ffffff;
		}
		.navbar-custom {
		    background: linear-gradient(90deg, #4a0e17 0%, #cc1e36 100%);
		    border-bottom: 2px solid #ffcc00;
		}
		.card-custom {
		    background-color: #2b0d12;
		    border: 1px solid #4a0e17;
		}
		.text-accent {
		    color: #ffcc00;
		}
		.btn-primary-custom {
		    background-color: #f25c19;
		    border-color: #f25c19;
		    color: #fff;
		}
		.btn-primary-custom:hover {
		    background-color: #cc1e36;
		    border-color: #cc1e36;
		}
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom px-3 mb-4">
        <div class="container-fluid d-flex align-items-center">
            <a class="navbar-brand d-flex align-items-center py-0" th:href="@{/productos}">
                <img th:src="@{/img/logo.jpeg}" alt="Logo" style="height: 48px; width: auto;" class="d-inline-block align-middle me-2 rounded">
                <span class="fw-bold fs-4 text-accent">JUEGOS.NET</span>
            </a>
            <div class="d-flex gap-2 ms-auto">
                <a th:href="@{/clientes}" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-arrow-left"></i> Volver a Usuarios
                </a>
            </div>
        </div>
    </nav>

    <div class="container mb-5" style="max-width: 650px;">
        <div class="card card-custom text-white p-4 shadow">
            <h3 class="text-accent fw-bold mb-4 text-center">
                <i class="bi bi-person-gear"></i> 
                <span th:text="${cliente.idCliente == null ? 'Registrar Nuevo Usuario/Cliente' : 'Editar Usuario/Cliente'}"></span>
            </h3>

            <form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post">
                <input type="hidden" th:field="*{idCliente}" />

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-accent fw-bold">Nombres:</label>
                        <input type="text" th:field="*{nombres}" class="form-control bg-dark text-white border-secondary" placeholder="Ej. Juan" required />
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('nombres')}" th:errors="*{nombres}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-accent fw-bold">Apellidos:</label>
                        <input type="text" th:field="*{apellidos}" class="form-control bg-dark text-white border-secondary" placeholder="Ej. Pérez" required />
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"></div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label text-accent fw-bold">Correo Electrónico:</label>
                    <input type="email" th:field="*{correo}" class="form-control bg-dark text-white border-secondary" placeholder="Ej. correo@juegos.net" required />
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-accent fw-bold">Contraseña:</label>
                        <input type="password" th:field="*{password}" class="form-control bg-dark text-white border-secondary" placeholder="••••••••" required />
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-accent fw-bold">Rol en el Sistema:</label>
                        <select th:field="*{rol}" class="form-select bg-dark text-white border-secondary" required>
                            <option value="ADMIN">ADMIN (Acceso Total)</option>
                            <option value="VENDEDOR">VENDEDOR (Reportes y Consultas)</option>
                            <option value="CLIENTE">CLIENTE (Solo Catálogo)</option>
                        </select>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('rol')}" th:errors="*{rol}"></div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-accent fw-bold">Teléfono:</label>
                        <input type="tel" th:field="*{telefono}" class="form-control bg-dark text-white border-secondary" placeholder="Ej. 987654321" pattern="[0-9]+" title="Ingrese solo dígitos numéricos" required />
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-accent fw-bold">Dirección:</label>
                        <input type="text" th:field="*{direccion}" class="form-control bg-dark text-white border-secondary" placeholder="Ej. Av. Principal 123" />
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}"></div>
                    </div>
                </div>

                <div class="d-flex justify-content-between gap-2 mt-4">
                    <button type="submit" class="btn btn-primary-custom w-50 fw-bold">
                        <i class="bi bi-check-circle-fill me-1"></i> Guardar
                    </button>
                    <a th:href="@{/clientes}" class="btn btn-outline-light w-50">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
