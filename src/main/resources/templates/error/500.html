<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error en la Solicitud - JUEGOS.NET</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background: radial-gradient(circle at center, #2e0910 0%, #120305 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .error-card {
            background-color: #240a0f;
            border: 1px solid #cc1e36;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            max-width: 550px;
            width: 100%;
        }
        .text-accent {
            color: #ffcc00;
        }
        .btn-custom {
            background-color: #f25c19;
            border-color: #f25c19;
            color: #fff;
            font-weight: 600;
        }
        .btn-custom:hover {
            background-color: #cc1e36;
            border-color: #cc1e36;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container p-3">
        <div class="error-card mx-auto p-4 p-md-5 text-center">
            <i class="bi bi-exclamation-triangle-fill text-danger fs-1 mb-3 d-block"></i>
            <h3 class="fw-bold text-accent mb-2">¡Ups! Algo no salió como esperábamos</h3>
            <p class="text-light small mb-4" th:text="${errorMensaje != null ? errorMensaje : 'Ocurrió un error interno en el servidor.'}"></p>
            <div class="d-flex justify-content-center gap-2">
                <a th:href="@{/productos}" class="btn btn-custom px-4">
                    <i class="bi bi-house-door-fill me-1"></i> Ir al Inicio
                </a>
                <button type="button" onclick="history.back()" class="btn btn-outline-light px-4">
                    <i class="bi bi-arrow-left me-1"></i> Volver
                </button>
            </div>
        </div>
    </div>
</body>
</html>
