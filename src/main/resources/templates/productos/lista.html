<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>JUEGOS.NET</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
		body {
		    background-color: #1a0508;
		    color: #ffffff;
		}
		.navbar-custom {
		    background: linear-gradient(90deg, #4a0e17 0%, #cc1e36 100%);
		    border-bottom: 2px solid #ffcc00;
		}
		.card-custom {
		    background-color: #2b0d12;
		    border: 1px solid #4a0e17;
		}
		.text-accent {
		    color: #ffcc00;
		}
		.table-custom {
		    color: #ffffff;
		    background-color: #2b0d12;
		}
		.table-custom th {
		    background-color: #4a0e17;
		    color: #ffcc00;
		}
		.btn-primary-custom {
		    background-color: #f25c19;
		    border-color: #f25c19;
		    color: #fff;
		}
		.btn-primary-custom:hover {
		    background-color: #cc1e36;
		    border-color: #cc1e36;
		}
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom px-3 mb-4">
        <div class="container-fluid d-flex align-items-center">
            <a class="navbar-brand d-flex align-items-center py-0" href="/productos">
                <img th:src="@{/img/logo.jpeg}" alt="Logo" style="height: 50px; width: auto;" class="d-inline-block align-middle">
            </a>
            <div class="d-flex gap-2">
                <a th:href="@{/productos/reporte/pdf}" target="_blank" rel="noopener" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-file-earmark-pdf"></i> Reporte PDF
                </a>
                <a th:href="@{/productos/nuevo}" class="btn btn-primary-custom btn-sm">Nuevo Juego</a>
                <a th:href="@{/proveedores}" class="btn btn-outline-light btn-sm">Proveedores</a>
                <a th:href="@{/clientes}" class="btn btn-outline-light btn-sm">Clientes</a>
            </div>
        </div>
    </nav>

    <div class="container mb-5">

        <div class="p-4 mb-4 rounded-3 banner-custom text-center shadow">
            <h2 class="fw-bold text-accent">🎮 CATÁLOGO DE VIDEOJUEGOS</h2>
            <p class="text-light mb-0">Explora las mejores ofertas y gestiona tu inventario fácilmente.</p>
        </div>

        <div class="row mb-4 g-3">
            <div class="col-md-6">
                <form th:action="@{/productos/filtrar}" method="get" class="card card-custom text-white p-3 shadow-sm">
                    <label class="form-label fw-bold text-accent">Filtrar por Categoría:</label>
                    <div class="input-group">
                        <select name="idCategoria" class="form-select bg-dark text-white border-secondary" required>
                            <option value="">-- Seleccione --</option>
                            <option th:each="cat : ${categorias}" th:value="${cat.idCategoria}" th:text="${cat.nombre}"></option>
                        </select>
                        <button type="submit" class="btn btn-primary-custom">Filtrar</button>
                        <a th:href="@{/productos}" class="btn btn-outline-light">Todos</a>
                    </div>
                </form>
            </div>

            <div class="col-md-6">
                <form th:action="@{/productos/filtrar-stock}" method="get" class="card card-custom text-white p-3 shadow-sm">
                    <label class="form-label fw-bold text-accent">Filtrar por Stock Máximo:</label>
                    <div class="input-group">
                        <input type="number" name="stock" class="form-control bg-dark text-white border-secondary" placeholder="Ej. 50" required min="0">
                        <button type="submit" class="btn btn-warning fw-bold">Stock</button>
                        <a th:href="@{/productos}" class="btn btn-outline-light">Todos</a>
                    </div>
                </form>
            </div>
        </div>

        <div th:if="${mensajeExito}" class="alert alert-success" role="alert" th:text="${mensajeExito}"></div>
        <div th:if="${mensajeError}" class="alert alert-danger" role="alert" th:text="${mensajeError}"></div>

        <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
            <div class="col" th:each="p : ${productos}">
                <div class="card card-custom text-white h-100 shadow">
                    
                    <img th:src="${p.imagen != null and p.imagen.startsWith('http') ? p.imagen : '/img/productos/' + p.imagen}" 
                         class="card-img-top" 
                         style="height: 180px; object-fit: cover;" 
                         onerror="this.src='https://via.placeholder.com/300x180?text=Sin+Imagen';" 
                         alt="Imagen">

                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title fw-bold text-accent" th:text="${p.nombre}"></h5>
                        <p class="card-text small text-light" th:text="${p.descripcion}"></p>
                        
                        <div class="mt-auto">
                            <p class="mb-1 text-warning fw-bold" th:text="${'Precio: S/ ' + p.precio}"></p>
                            <p class="mb-3 text-light small" th:text="${'Stock: ' + p.stock}"></p>

                            <div class="d-flex justify-content-between gap-2">
                                <a th:href="@{/productos/editar/{id}(id=${p.idProducto})}" class="btn btn-warning btn-sm w-50 fw-bold">Editar</a>
                                <a th:href="@{/productos/eliminar/{id}(id=${p.idProducto})}" class="btn btn-danger btn-sm w-50" onclick="return confirm('¿Eliminar producto?');">Eliminar</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(productos)}" class="text-center mt-5">
            <p class="text-muted">No hay productos para mostrar.</p>
        </div>

    </div>

</body>
</html>
