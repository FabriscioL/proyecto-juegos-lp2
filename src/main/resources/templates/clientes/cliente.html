<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios y Clientes - JUEGOS.NET</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #1a0508;
            color: #ffffff;
        }
        .navbar-custom {
            background: linear-gradient(90deg, #4a0e17 0%, #cc1e36 100%);
            border-bottom: 2px solid #ffcc00;
        }
        .card-custom {
            background-color: #2b0d12;
            border: 1px solid #4a0e17;
        }
        .text-accent {
            color: #ffcc00;
        }
        .table-custom {
            color: #ffffff;
            background-color: #2b0d12;
        }
        .table-custom th {
            background-color: #4a0e17;
            color: #ffcc00;
        }
        .btn-primary-custom {
            background-color: #f25c19;
            border-color: #f25c19;
            color: #fff;
        }
        .btn-primary-custom:hover {
            background-color: #cc1e36;
            border-color: #cc1e36;
        }
        .badge-admin {
            background-color: #ffcc00;
            color: #000;
            font-weight: bold;
        }
        .badge-vendedor {
            background-color: #0dcaf0;
            color: #000;
            font-weight: bold;
        }
        .badge-cliente {
            background-color: #6c757d;
            color: #fff;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom px-3 mb-4">
        <div class="container-fluid d-flex align-items-center justify-content-between">
            <a class="navbar-brand d-flex align-items-center py-0" th:href="@{/productos}">
                <img th:src="@{/img/logo.jpeg}" alt="Logo" style="height: 48px; width: auto;" class="d-inline-block align-middle me-2 rounded">
                <span class="fw-bold fs-4 text-accent d-none d-sm-inline">JUEGOS.NET</span>
            </a>
            <div class="d-flex align-items-center gap-2">
                <a th:href="@{/dashboard}" class="btn btn-outline-light btn-sm"><i class="bi bi-speedometer2"></i> Dashboard</a>
                <a th:href="@{/productos}" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-controller"></i> Videojuegos
                </a>
                <a th:if="${session.usuarioRol == 'ADMIN'}" th:href="@{/papelera}" class="btn btn-outline-warning btn-sm">
                    <i class="bi bi-recycle"></i> Papelera
                </a>
                <a th:href="@{/proveedores}" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-truck"></i> Proveedores
                </a>
                <div class="d-flex align-items-center ms-2 border-start border-secondary ps-3">
                    <div class="me-2 text-end d-none d-md-block">
                        <small class="d-block text-light" th:text="${session.usuarioNombre}"></small>
                        <span th:if="${session.usuarioRol == 'ADMIN'}" class="badge badge-admin">ADMINISTRADOR</span>
                        <span th:if="${session.usuarioRol == 'VENDEDOR'}" class="badge badge-vendedor">VENDEDOR</span>
                    </div>
                    <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm" title="Cerrar sesión">
                        <i class="bi bi-box-arrow-right"></i>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <h2 class="text-accent fw-bold mb-0">
                <i class="bi bi-people-fill"></i> 
                <span th:text="${session.usuarioRol == 'ADMIN' ? 'Gestión de Cuentas y Roles de Usuarios' : 'Listado de Clientes'}"></span>
            </h2>
            <div class="d-flex gap-2">
                <a th:href="@{/clientes/reporte/pdf}" target="_blank" rel="noopener" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-file-earmark-pdf"></i> Reporte PDF
                </a>
                <!-- Nuevo Usuario: Solo ADMIN -->
                <a th:if="${session.usuarioRol == 'ADMIN'}" th:href="@{/clientes/nuevo}" class="btn btn-primary-custom btn-sm fw-bold">
                    <i class="bi bi-plus-circle"></i> Nuevo Usuario/Cliente
                </a>
            </div>
        </div>

        <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-1"></i> <span th:text="${mensajeExito}"></span>
        </div>
        <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${mensajeError}"></span>
        </div>

        <div class="card card-custom p-3 shadow">
            <div class="table-responsive">
                <table class="table table-custom table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombres y Apellidos</th>
                            <th>Correo</th>
                            <th>Teléfono</th>
                            <th>Dirección</th>
                            <th class="text-center">Rol Asignado</th>
                            <th th:if="${session.usuarioRol == 'ADMIN'}" class="text-center">Cambiar Rol</th>
                            <th th:if="${session.usuarioRol == 'ADMIN'}" class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${clientes}">
                            <td th:text="${c.idCliente}"></td>
                            <td class="fw-bold" th:text="${c.nombres + ' ' + c.apellidos}"></td>
                            <td th:text="${c.correo}"></td>
                            <td th:text="${c.telefono}"></td>
                            <td th:text="${c.direccion}"></td>
                            
                            <!-- Etiqueta de Rol -->
                            <td class="text-center">
                                <span th:if="${c.rol == 'ADMIN'}" class="badge badge-admin px-2 py-1"><i class="bi bi-shield-lock-fill"></i> ADMIN</span>
                                <span th:if="${c.rol == 'VENDEDOR'}" class="badge badge-vendedor px-2 py-1"><i class="bi bi-briefcase-fill"></i> VENDEDOR</span>
                                <span th:if="${c.rol != 'ADMIN' and c.rol != 'VENDEDOR'}" class="badge badge-cliente px-2 py-1"><i class="bi bi-person"></i> CLIENTE</span>
                            </td>

                            <!-- Formulario para administrar Roles (Solo ADMIN) -->
                            <td th:if="${session.usuarioRol == 'ADMIN'}" class="text-center">
                                <form th:action="@{/clientes/cambiar-rol/{id}(id=${c.idCliente})}" method="post" class="d-inline-flex gap-1 align-items-center justify-content-center">
                                    <select name="rol" class="form-select form-select-sm bg-dark text-white border-secondary py-0" style="width: auto;">
                                        <option value="ADMIN" th:selected="${c.rol == 'ADMIN'}">ADMIN</option>
                                        <option value="VENDEDOR" th:selected="${c.rol == 'VENDEDOR'}">VENDEDOR</option>
                                        <option value="CLIENTE" th:selected="${c.rol == 'CLIENTE' or c.rol == null}">CLIENTE</option>
                                    </select>
                                    <button type="submit" class="btn btn-sm btn-outline-warning" title="Actualizar Rol">
                                        <i class="bi bi-check-lg"></i>
                                    </button>
                                </form>
                            </td>

                            <!-- Acciones de edición y borrado lógico (Solo ADMIN) -->
                            <td th:if="${session.usuarioRol == 'ADMIN'}" class="text-center">
                                <a th:href="@{/clientes/editar/{id}(id=${c.idCliente})}" class="btn btn-warning btn-sm fw-bold">
                                    <i class="bi bi-pencil-square"></i> Editar
                                </a>
                                <a th:href="@{/clientes/eliminar/{id}(id=${c.idCliente})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Desea desactivar (borrado lógico) esta cuenta?');">
                                    <i class="bi bi-trash"></i> Eliminar
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(clientes)}">
                            <td th:colspan="${session.usuarioRol == 'ADMIN' ? 8 : 6}" class="text-center text-muted py-4">No hay clientes ni usuarios activos registrados.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
