<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Clientes - JUEGOS.NET</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #1a0508;
            color: #ffffff;
        }
        .navbar-custom {
            background: linear-gradient(90deg, #4a0e17 0%, #cc1e36 100%);
            border-bottom: 2px solid #ffcc00;
        }
        .card-custom {
            background-color: #2b0d12;
            border: 1px solid #4a0e17;
        }
        .text-accent {
            color: #ffcc00;
        }
        .table-custom {
            color: #ffffff;
            background-color: #2b0d12;
        }
        .table-custom th {
            background-color: #4a0e17;
            color: #ffcc00;
        }
        .btn-primary-custom {
            background-color: #f25c19;
            border-color: #f25c19;
            color: #fff;
        }
        .btn-primary-custom:hover {
            background-color: #cc1e36;
            border-color: #cc1e36;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom px-3 mb-4">
        <div class="container-fluid d-flex align-items-center">
            <a class="navbar-brand d-flex align-items-center py-0" href="/productos">
                <img th:src="@{/img/logo.jpeg}" alt="Logo" style="height: 50px; width: auto;" class="d-inline-block align-middle">
            </a>
            <div class="d-flex gap-2">
                <a th:href="@{/productos}" class="btn btn-outline-light btn-sm">Productos</a>
                <a th:href="@{/proveedores}" class="btn btn-outline-light btn-sm">Proveedores</a>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-accent fw-bold"><i class="bi bi-people-fill"></i> Mantenimiento de Clientes</h2>
            <div class="d-flex gap-2">
                <a th:href="@{/clientes/reporte/pdf}" target="_blank" rel="noopener" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-file-earmark-pdf"></i> Reporte PDF
                </a>
                <a th:href="@{/clientes/nuevo}" class="btn btn-primary-custom btn-sm fw-bold"><i class="bi bi-plus-circle"></i> Nuevo Cliente</a>
            </div>
        </div>

        <div class="card card-custom p-3 shadow">
            <div class="table-responsive">
                <table class="table table-custom table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombres</th>
                            <th>Apellidos</th>
                            <th>Correo</th>
                            <th>Teléfono</th>
                            <th>Dirección</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${clientes}">
                            <td th:text="${c.idCliente}"></td>
                            <td th:text="${c.nombres}"></td>
                            <td th:text="${c.apellidos}"></td>
                            <td th:text="${c.correo}"></td>
                            <td th:text="${c.telefono}"></td>
                            <td th:text="${c.direccion}"></td>
                            <td class="text-center">
                                <a th:href="@{/clientes/editar/{id}(id=${c.idCliente})}" class="btn btn-warning btn-sm fw-bold">Editar</a>
                                <a th:href="@{/clientes/eliminar/{id}(id=${c.idCliente})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Estás seguro de eliminar este cliente?');">Eliminar</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(clientes)}">
                            <td colspan="7" class="text-center text-muted">No hay clientes registrados.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
