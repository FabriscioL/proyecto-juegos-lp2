<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Proveedor - JUEGOS.NET</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
		body {
		    background-color: #1a0508;
		    color: #ffffff;
		}
		.navbar-custom {
		    background: linear-gradient(90deg, #4a0e17 0%, #cc1e36 100%);
		    border-bottom: 2px solid #ffcc00;
		}
		.card-custom {
		    background-color: #2b0d12;
		    border: 1px solid #4a0e17;
		}
		.text-accent {
		    color: #ffcc00;
		}
		.table-custom {
		    color: #ffffff;
		    background-color: #2b0d12;
		}
		.table-custom th {
		    background-color: #4a0e17;
		    color: #ffcc00;
		}
		.btn-primary-custom {
		    background-color: #f25c19;
		    border-color: #f25c19;
		    color: #fff;
		}
		.btn-primary-custom:hover {
		    background-color: #cc1e36;
		    border-color: #cc1e36;
		}
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom px-3 mb-4">
        <div class="container-fluid d-flex align-items-center">
            <a class="navbar-brand d-flex align-items-center py-0" th:href="@{/productos}">
                <img th:src="@{/img/logo.jpeg}" alt="Logo" style="height: 48px; width: auto;" class="d-inline-block align-middle me-2 rounded">
                <span class="fw-bold fs-4 text-accent">JUEGOS.NET</span>
            </a>
            <div class="d-flex gap-2 ms-auto">
                <a th:href="@{/proveedores}" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-arrow-left"></i> Volver a Proveedores
                </a>
            </div>
        </div>
    </nav>

    <div class="container mb-5" style="max-width: 650px;">
        <div class="card card-custom text-white p-4 shadow">
            <h3 class="text-accent fw-bold mb-4 text-center">
                <i class="bi bi-building-add"></i> 
                <span th:text="${proveedor.idProveedor == null ? 'Registrar Nuevo Proveedor' : 'Editar Proveedor'}"></span>
            </h3>

            <form th:action="@{/proveedores/guardar}" th:object="${proveedor}" method="post">
                <input type="hidden" th:field="*{idProveedor}" />

                <div class="mb-3">
                    <label class="form-label text-accent fw-bold">Nombre de la Empresa / Proveedor:</label>
                    <input type="text" th:field="*{nombre}" class="form-control bg-dark text-white border-secondary" placeholder="Ej. Proveedor Gamer S.A.C." required />
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label text-accent fw-bold">Nombre de Contacto:</label>
                    <input type="text" th:field="*{contacto}" class="form-control bg-dark text-white border-secondary" placeholder="Ej. Carlos Ruiz" />
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('contacto')}" th:errors="*{contacto}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label text-accent fw-bold">Teléfono:</label>
                    <input type="tel" th:field="*{telefono}" class="form-control bg-dark text-white border-secondary" placeholder="Ej. 999888777" pattern="[0-9]+" title="Ingrese solo números válidos" />
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-accent fw-bold">Correo Electrónico:</label>
                    <input type="email" th:field="*{correo}" class="form-control bg-dark text-white border-secondary" placeholder="Ej. contacto@proveedor.com" />
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
                </div>

                <div class="d-flex justify-content-between gap-2 mt-4">
                    <button type="submit" class="btn btn-primary-custom w-50 fw-bold">
                        <i class="bi bi-check-circle-fill me-1"></i> Guardar
                    </button>
                    <a th:href="@{/proveedores}" class="btn btn-outline-light w-50">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
