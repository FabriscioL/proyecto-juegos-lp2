<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - JUEGOS.NET</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background: radial-gradient(circle at center, #2e0910 0%, #120305 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background-color: #240a0f;
            border: 1px solid #4a0e17;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            width: 100%;
            max-width: 440px;
        }
        .text-accent {
            color: #ffcc00;
        }
        .btn-custom {
            background-color: #f25c19;
            border-color: #f25c19;
            color: #fff;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-custom:hover {
            background-color: #cc1e36;
            border-color: #cc1e36;
            color: #fff;
        }
        .badge-role {
            font-size: 0.75rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container p-3">
        <div class="login-card mx-auto p-4 p-md-5">
            <div class="text-center mb-4">
                <img th:src="@{/img/logo.jpeg}" alt="Logo" style="height: 65px; width: auto;" class="mb-3 rounded">
                <h3 class="fw-bold text-accent mb-1">🎮 JUEGOS.NET</h3>
                <p class="text-light small">Ingresa tus credenciales para acceder</p>
            </div>

            <!-- Alertas de éxito y error -->
            <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show py-2" role="alert">
                <i class="bi bi-check-circle-fill me-1"></i> <span th:text="${mensajeExito}"></span>
            </div>
            <div th:if="${errorLogin}" class="alert alert-danger alert-dismissible fade show py-2" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${errorLogin}"></span>
            </div>

            <form th:action="@{/login}" th:object="${loginDto}" method="post">
                <div class="mb-3">
                    <label class="form-label text-accent fw-semibold">Correo Electrónico:</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark text-secondary border-secondary"><i class="bi bi-envelope"></i></span>
                        <input type="email" id="correoInput" th:field="*{correo}" class="form-control bg-dark text-white border-secondary" placeholder="ejemplo@juegos.net" required autofocus />
                    </div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-accent fw-semibold">Contraseña:</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark text-secondary border-secondary"><i class="bi bi-lock"></i></span>
                        <input type="password" id="passwordInput" th:field="*{password}" class="form-control bg-dark text-white border-secondary" placeholder="••••••••" required />
                    </div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <button type="submit" class="btn btn-custom w-100 py-2 mb-3">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
                </button>
            </form>

            <!-- Acceso rápido para demostración -->
            <div class="border-top border-secondary pt-3 mt-2 text-center">
                <p class="small text-muted mb-2">Cuentas demo (clic para autocompletar):</p>
                <div class="d-flex justify-content-center gap-2">
                    <button type="button" class="btn btn-outline-warning btn-sm badge-role" onclick="llenarCredenciales('admin@juegos.net', '12345')">
                        👑 Admin
                    </button>
                    <button type="button" class="btn btn-outline-info btn-sm badge-role" onclick="llenarCredenciales('vendedor1@juegos.net', '12345')">
                        💼 Vendedor
                    </button>
                    <button type="button" class="btn btn-outline-light btn-sm badge-role" onclick="llenarCredenciales('cristofer@gmail.com', '123456')">
                        👤 Cliente
                    </button>
                </div>
            </div>

            <div class="text-center mt-4">
                <span class="text-light small">¿No tienes una cuenta? </span>
                <a th:href="@{/registro}" class="text-accent text-decoration-none fw-bold small">Regístrate aquí</a>
            </div>
        </div>
    </div>

    <script>
        function llenarCredenciales(correo, clave) {
            document.getElementById('correoInput').value = correo;
            document.getElementById('passwordInput').value = clave;
        }
    </script>
</body>
</html>
